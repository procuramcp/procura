name: CI

on:
  push:
    branches: [main]
    # A version tag (v0.1.0) publishes that version of the image (D-046).
    tags: ["v*"]
  pull_request:

# Least privilege: CI only reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main finish, so a deploy is never cut off halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22 is the minimum supported (engines: >=22.18); 24 is the current LTS.
        node: [22, 24]
    # Real Postgres for the tenant isolation tests (packages/db). Required here:
    # with CI set, the db tests fail instead of skipping if the URL is missing.
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # A throwaway superuser on the job's own service container; not a secret.
      PROCURA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      # Actions are pinned to commit SHAs so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres for the smoke test, as for the isolation tests.
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # A throwaway superuser on the job's own service container; not a secret.
      PROCURA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Built here for the smoke tests; the publish job builds the multi-arch image it pushes.
      - run: docker build --tag procura:ci .

      - run: scripts/image-smoke.sh procura:ci

      # The self-host setup end to end: compose up, sign in through Dex, first tenant, upgrade.
      - run: scripts/compose-smoke.sh procura:ci

  # Publish the image for self-hosting (D-046): `edge` and `sha-…` from main; `0.1.0`, `0.1`,
  # and `latest` from a version tag. amd64 and arm64 (Apple silicon, Graviton, Ampere).
  publish:
    name: Publish the image
    if: github.event_name == 'push'
    needs: [check, image]
    runs-on: ubuntu-latest
    # The arm64 half builds under emulation.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Push to main deploys to the Oracle VM once tests and the image smoke test pass (D-036).
  # The key can only run the VM's deploy command (deploy/oracle/ci-receive.sh); secrets live
  # in the "production" environment, where you can also require an approval per deploy.
  deploy:
    name: Deploy to the Oracle VM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [check, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://${{ vars.DEPLOY_DOMAIN }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The VM's receive script expects cairnmcp:<tag> (deploy/oracle, unchanged by D-047).
      - name: Build the image for the VM (x86)
        run: |
          tag="$(git rev-parse --short=12 HEAD)"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 --tag "cairnmcp:$tag" .

      - name: Ship and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          # The VM's host key is pinned: no trust on first use.
          ssh_opts=(-i "$key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes)
          hash="$(cd deploy/oracle && sha256sum compose.yaml Caddyfile deploy.sh | sha256sum | cut -c1-64)"
          docker save "cairnmcp:$TAG" | gzip -1 | ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "deploy $TAG $hash"

      - name: Check the live site
        run: curl -fsS --retry 5 --retry-delay 3 "https://${{ vars.DEPLOY_DOMAIN }}/healthz"
