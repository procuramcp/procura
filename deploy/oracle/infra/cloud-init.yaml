#cloud-config
# First boot of the cairnmcp VM: everything setup-vm.sh does except settings
# and secrets, which stay out of Terraform state. setup-vm.sh then finds these
# steps done and skips them.

package_update: true
package_upgrade: true

# 2 GB of swap: the free E2.1.Micro has 1 GB of memory.
swap:
  filename: /swapfile
  size: 2147483648

write_files:
  - path: /etc/sysctl.d/99-cairnmcp-swap.conf
    content: |
      vm.swappiness=10
  - path: /usr/local/sbin/cairnmcp-bootstrap
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive

      # Docker, from Docker's apt repository.
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      . /etc/os-release
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" >/etc/apt/sources.list.d/docker.list
      apt-get update -q
      apt-get install -yq docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin unattended-upgrades iptables-persistent
      usermod -aG docker ubuntu

      # Oracle's Ubuntu images reject everything but SSH in iptables, even when
      # the security list allows it: allow 80/443 just above that REJECT rule.
      allow() {
        iptables -C INPUT -p "$1" --dport "$2" -j ACCEPT 2>/dev/null && return
        local reject
        reject="$(iptables -L INPUT --line-numbers -n | awk '$2 == "REJECT" { print $1; exit }')"
        iptables -I INPUT "${reject:-1}" -p "$1" --dport "$2" -j ACCEPT
      }
      allow tcp 80
      allow tcp 443
      allow udp 443
      netfilter-persistent save

      sysctl -q -p /etc/sysctl.d/99-cairnmcp-swap.conf
      dpkg-reconfigure -f noninteractive unattended-upgrades

runcmd:
  - [/usr/local/sbin/cairnmcp-bootstrap]
